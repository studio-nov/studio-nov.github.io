<style>
  :root { --negro:#000000; --blanco:#FFFFFF; --rosa-claro:#FCE9E9; --rosa:#F4A9A3; --coral:#ED767F; --gris:#5c5c5c; }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 20px;
    color:var(--negro); background:var(--blanco);
    background-image:radial-gradient(120% 60% at 50% 0%, var(--rosa-claro) 0%, var(--blanco) 70%);
    font-family:"Raleway", -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-weight:500; text-align:center; font-variant-numeric:lining-nums;
  }
  .caja { max-width:380px; }
  .logo { width:190px; height:auto; margin:0 auto 34px; display:block; }
  .eyebrow { font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--coral); margin:0 0 12px; }
  h1 { font-weight:700; font-size:30px; line-height:1.1; letter-spacing:-.02em; margin:0 0 14px; }
  p.texto { font-size:15px; line-height:1.55; color:var(--gris); margin:0 auto; max-width:320px; }
  .pasos { margin:28px auto 0; padding:18px 20px; border-radius:18px; background:var(--blanco);
           border:2px solid var(--rosa-claro); text-align:left; font-size:14px; line-height:1.5; color:var(--gris); }
  .pasos b { color:var(--coral); font-weight:700; margin-right:6px; }
  .pasos div + div { margin-top:8px; }
  .pie { margin-top:40px; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:#9a9a9a; }
</style>
